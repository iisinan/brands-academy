    <!-- Ribbon 2 -->
    <path d="M -56,-48 
             C -20,-60 22,-52 54,-24 
             C 34,-36 -4,-42 -38,-34 
             C -56,-28 -64,-38 -56,-48 Z" 
          fill="url(#globeGrad)" />

