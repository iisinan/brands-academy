<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 260" width="300" height="300">
  <defs>
    <linearGradient id="globeGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020617" flood-opacity="0.3" />
    </filter>
  </defs>
  <g filter="url(#subtleShadow)">
